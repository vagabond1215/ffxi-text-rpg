constraints:
  - new zones require plausible flora fauna resources drops or catches and connected processing
  - food-capable items require explicit direct-vs-processing-required consumption metadata
  - world-facing food safety should use practical late-medieval fantasy knowledge rather than modern microbiology language
  - raw toxic or irritant foods require explicit hazards and plausible preparation instructions
  - do not add disconnected filler merely to satisfy content targets
  - keep Game State 14 unless a new durable player/world fact actually requires change
  - do not create duplicate domain authorities
  - managed livestock products require an intentional husbandry source model rather than fake flora provenance
  - portable replaceable cross-profession components should be canonical items when independently traded repaired replaced or reused
  - regional resilience prefers ordinary substitute routes and dependable trade basins over duplicating specialty resources in every biome
  - premium outcomes may still require specialty trade
  - Coppergrass remains a transit wilderness until a staffed locality is intentionally authored
  - current starting nations are mixed-race political states rather than racial homelands
  - future ancestral capitals should normally be separated by multiple macro-regions plus at least one meaningful physical magical environmental political or vertical barrier
  - world macro geography uses irregular envelopes plus canonical routes and local place coordinates rather than a global square or hex tessellation
  - touching geographic envelopes do not imply traversability; routes passes gates waterways tunnels and other authored connections remain authoritative
  - Great Mere is an open east-draining freshwater basin whose lower outflow reaches a future brackish delta and the Eastern Sea
  - reserve continents coastlines mountain chains drainage and civilization envelopes before further edge-by-edge biome authoring
  - roadmap and world-edge sequencing do not auto-authorize later units
  - prefer direct work on main unless a change has material rollback risk that ordinary GitHub revert cannot safely contain
