schema_version: 1
repository:
  name: vagabond1215/ffxi-text-rpg
  default_branch: main
project:
  title: Hearth & Horizon
  type: persistent-game-application
  phase: pre-alpha-active-development
  assurance_tier: B-plus
authority:
  instructions: AGENTS.md
  handoff: docs/THREAD_HANDOFF.md
  design_direction: docs/DEVELOPMENT_DIRECTION.md
  roadmap: docs/ROADMAP.md
  architecture: docs/ARCHITECTURE.md
  runtime_version: js/text/version.js
  quality_gates: docs/QUALITY_GATES.md
  performance_budget: docs/PERFORMANCE_BUDGET.md
  resource_lifecycle: docs/RESOURCE_LIFECYCLE.md
tools:
  github_connector: repository-inspection-and-bounded-doc-work
  repository_capable_execution: runtime-implementation-and-executable-validation
  principle: least-powerful-safe-tool
git:
  normal_work: direct-main
  risky_or_explicit_review_work: feature-branch-pr
  stabilization_transition: protect-default-branch-and-require-green-ci
validation:
  tests: npm test
  benchmark: npm run benchmark
  benchmark_sample: npm run benchmark:sample
  hardening: npm run hardening
  aggregate: npm run check
  hosted_check: Check
  node_baseline: 24
  architecture_debt_guard: tests/architectureDebtGuard.test.js
  long_session_guard: tests/longSessionLifecycle.test.js
  lifecycle_guards:
    - tests/tickLifecycle.test.js
    - tests/domRootLifecycle.test.js
    - tests/timedTaskReleaseLifecycle.test.js
    - tests/workProjectTaskReleaseLifecycle.test.js
    - tests/currentSchemaTaskLinks.test.js
    - tests/currentSchemaTaskRegistry.test.js
    - tests/activeTaskPersistenceMatrix.test.js
  current_schema_registry_guards:
    - tests/currentSchemaProjectRegistry.test.js
    - tests/currentSchemaContinuityRegistries.test.js
    - tests/currentSchemaResourceOpportunities.test.js
    - tests/currentSchemaEcologyRegistry.test.js
    - tests/currentSchemaCharacterRuntime.test.js
    - tests/currentSchemaWorldSimulation.test.js
    - tests/currentSchemaPlayerCapabilities.test.js
    - tests/currentSchemaInventoryState.test.js
    - tests/currentSchemaSemanticEvents.test.js
    - tests/currentSchemaWorkRegistry.test.js
    - tests/currentSchemaPlayerProgression.test.js
    - tests/currentSchemaDiscoveryPersistence.test.js
    - tests/currentSchemaWorkProficiencies.test.js
    - tests/currentSchemaPlayerResources.test.js
    - tests/currentSchemaDayCycle.test.js
    - tests/currentSchemaPlayerWallet.test.js
    - tests/currentSchemaDerivedPlayerState.test.js
    - tests/currentSchemaPlayerEquipment.test.js
    - tests/currentSchemaPlayerStatuses.test.js
    - tests/currentSchemaActiveBattle.test.js
    - tests/playerPersistenceIntegration.test.js
    - tests/currentSchemaLocationPersistence.test.js
    - tests/currentSchemaCombatIdentityPersistence.test.js
    - tests/currentSchemaNpcWorldProjection.test.js
    - tests/currentSchemaEnemyEncounterProjection.test.js
    - tests/currentSchemaPresentationLog.test.js
  benchmark_protocol_guard: tests/benchmarkProtocol.test.js
modules:
  - game-runtime
  - persistent-state
  - web-ui
  - deterministic-simulation
quality:
  deterministic_simulation: preserve
  save_compatibility: current-schema-only-pre-alpha
  current_account_save: 5
  current_game_state: 12
  current_data_version: 37
  current_benchmark_version: 3
  current_game_state_must_be_complete_before_revival: true
  raw_current_schema_validation_before_runtime_normalization: true
  active_task_links_must_be_persisted_and_consistent: true
  raw_domain_validation:
    required:
      - world-time
      - simulation-control
      - timed-tasks
      - active-travel
      - projects
      - commitments
      - relationships
      - resource-opportunities
      - ecology
      - party
      - ability-runtime
      - semantic-events
      - atlas-discovery
      - poi-discovery
      - player-envelope
      - player-identity-key-items-flags
      - player-progression-and-skills
      - player-capabilities
      - player-inventory-state
      - player-mutable-resources
      - player-wallet
      - player-equipment
      - player-statuses
      - world-flags
      - current-location-position
      - combat-identity-sequence
      - active-battle-when-present
      - active-battle-deterministic-combat-caches
      - active-battle-root-player-link
    optional_when_present:
      - work-registry
      - player-work-proficiencies
      - day-cycle-history
  post_revival_or_derived:
    - broad-player-validation
    - flat-inventory-alias-identity
    - player-combat-profile
    - player-stat-state
    - derived-combat-stat-maxima
    - active-battle-rng
    - npc-world-projection
    - enemy-encounter-projection
    - command-presentation-log
  serialization_exclusions:
    - player-combat-profile
    - player-stat-state
    - active-battle-rng
    - state-npcs
    - state-enemies
    - state-log
  next_classification_audit: []
  future_migrations: deliberate-only-when-required
  canonical_action_results_only: true
  resource_lifecycle_review: required
  long_session_stability: deterministic-smoke-required-for-lifecycle-sensitive-work
  benchmark_protocol: 3
  benchmark_warmup_ratio: 0.1
  hard_performance_thresholds: not-yet-accepted
constraints:
  - use current repository authority rather than conversation memory
  - preserve the original-world canon and legacy/reference boundary
  - preserve the distinction between fictional simulation time and wall-clock scheduling
  - preserve player-facing acquired-knowledge map privacy
  - reject incompatible or incomplete pre-alpha saves/accounts rather than adding compatibility scaffolding by default
  - keep the generic migration substrate available for future deliberate migrations without making migration automatic
  - keep carried inventory/container facts under inventory authority rather than duplicating container knowledge in consumers
  - do not reintroduce retired FFXI command runtime compatibility
  - direct production timed-task creation requires an explicit domain owner exactly-once reconciliation and terminal release responsibility
  - do not add blind global timed-task pruning when no concrete generic producer/history requirement exists
  - raw Game State 12 validation must reject malformed persisted authority before runtime ensure helpers can normalize it
  - classify state as persistent authority derived-transient construction convenience or optional persisted authority before adding a raw validator
  - do not compose broad validatePlayer at the raw boundary because it mixes post-revival identity and derived-state checks
  - keep work work-proficiencies and day-cycle state optional when absent but strict when persisted
  - persist atlas discovery timing in canonical fictional seconds never wall-clock timestamps
  - omit root player combat and stat caches from save payloads and rebuild them after raw validation
  - keep mutable player HP MP TP independent from derived maximum-resource calculations
  - equipped items and canonical player statuses are durable persistence authority
  - player identity key-items player flags and world flags are strict durable authority
  - currentPlaceId location and position must remain one coherent canonical location state
  - combatSequence is the persisted encounter-id allocator and must agree with activeBattle.id when a battle is present
  - active battle state and deterministic combat/stat snapshots are persisted while battle rng is transient and non-persisted
  - an active battle player must remain bound to the root player id resources statuses and combat-driving profile while terminal battle snapshots remain historical
  - post-load root-owned combat skill gains must synchronize into the active battle player before encounter cache refresh
  - refresh combatant and root player derived profiles after status reconciliation and durable combat synchronization
  - state.npcs is a post-validation runtime projection rebuilt from canonical seed NPC definitions plus persisted party companion authority and must not be serialized as a second authority
  - state.enemies is a post-validation encounter-template projection rebuilt from canonical seed enemy definitions; authored template combat/resources are derived construction data while mutable encounter authority belongs to activeBattle
  - top-level state.log is session-only command presentation history with wall-clock display timestamps; it is omitted from Game State and reset on character load
  - state.events remains the persisted structured semantic observation channel and must not parse or depend on command-log prose
  - activeBattle.log is separate persisted encounter-local history and is not the top-level presentation log
  - canvas command history and output buffers remain transient UI state separate from Game State
  - the broad top-level npcs enemies and log classification series is complete; choose future work through a fresh bounded work order
  - roadmap sequencing does not authorize unbounded implementation
