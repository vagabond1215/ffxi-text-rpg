constraints:
  - do not count catalog refs twice or generated fixtures as canonical gameplay breadth
  - do not add disconnected filler merely to satisfy content targets
  - preserve existing canonical catalog definition authority behind content-pack ownership metadata
  - preserve original-world canon and legacy/reference boundaries
  - preserve fictional simulation time versus wall-clock scheduling
  - keep Game State 14 unless a new durable player/world fact actually requires change
  - do not add duplicate simulation clock task inventory progression social ecology or mount authority
  - local map edges are not automatically walkable world boundaries
  - physical legal and environmental access restrictions remain distinct
  - ordinary two-way roads and gates should be reciprocal unless explicitly modeled otherwise
  - roadmap sequencing and temporary world-edge sequencing do not auto-authorize later units
