constraints:
  - use current repository authority rather than conversation memory
  - read thread handoff and execution pipeline before broad discovery
  - if pull request 378 remains unmerged resolve its status before starting 0.8.800 by default
  - preserve the original-world canon and legacy/reference boundary
  - preserve the distinction between fictional simulation time and wall-clock scheduling
  - reject incompatible or incomplete pre-alpha saves/accounts rather than adding compatibility scaffolding by default
  - raw Game State 13 must reject malformed cultivation authority before runtime ensure helpers normalize it
  - cultivation growth is timestamp-derived from canonical fictional time and must not create a crop-owned long-lived timed task
  - cultivation preparation and tending reuse the existing work task owner and exactly-once terminal release contract
  - planting consumes a physical inventory item and harvest creates ordinary inventory output
  - cultivated output remains the existing canonical Sweetroot item and provenance distinguishes its home-grown origin
  - seed provenance must survive the growth cycle into harvest provenance
  - harvest must be exactly once and replay-safe
  - cultivation mastery belongs to persistent work proficiency rather than a parallel progression counter
  - semantic player actions must not require command-string manufacture
  - cultivation recommendation priority must not suppress existing active or ready commitment livelihood home or recovery decisions
  - state.events remains the persisted structured semantic observation channel
  - state.npcs state.enemies and top-level state.log remain non-authoritative projections/presentation state
  - direct production timed-task creation requires an explicit domain owner exactly-once reconciliation and terminal release responsibility
  - do not add blind global timed-task pruning
  - content-heavy work should run the census without gaming counts with disconnected filler
  - roadmap sequencing does not authorize unbounded implementation
