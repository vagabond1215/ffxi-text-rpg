schema_version: 1
repository:
  name: vagabond1215/ffxi-text-rpg
  default_branch: main
project:
  title: Hearth & Horizon
  type: persistent-game-application
  phase: pre-alpha-active-development
  assurance_tier: B-plus
authority:
  instructions: AGENTS.md
  handoff: docs/THREAD_HANDOFF.md
  design_direction: docs/DEVELOPMENT_DIRECTION.md
  roadmap: docs/ROADMAP.md
  architecture: docs/ARCHITECTURE.md
  runtime_version: js/text/version.js
  quality_gates: docs/QUALITY_GATES.md
  performance_budget: docs/PERFORMANCE_BUDGET.md
  resource_lifecycle: docs/RESOURCE_LIFECYCLE.md
tools:
  github_connector: repository-inspection-and-bounded-doc-work
  repository_capable_execution: runtime-implementation-and-executable-validation
  principle: least-powerful-safe-tool
git:
  normal_work: direct-main
  risky_or_explicit_review_work: feature-branch-pr
  stabilization_transition: protect-default-branch-and-require-green-ci
validation:
  tests: npm test
  benchmark: npm run benchmark
  benchmark_sample: npm run benchmark:sample
  hardening: npm run hardening
  aggregate: npm run check
  hosted_check: Check
  node_baseline: 24
  architecture_debt_guard: tests/architectureDebtGuard.test.js
  long_session_guard: tests/longSessionLifecycle.test.js
  lifecycle_guards:
    - tests/tickLifecycle.test.js
    - tests/domRootLifecycle.test.js
    - tests/timedTaskReleaseLifecycle.test.js
    - tests/workProjectTaskReleaseLifecycle.test.js
    - tests/currentSchemaTaskLinks.test.js
    - tests/currentSchemaTaskRegistry.test.js
    - tests/activeTaskPersistenceMatrix.test.js
  current_schema_registry_guards:
    - tests/currentSchemaProjectRegistry.test.js
    - tests/currentSchemaContinuityRegistries.test.js
    - tests/currentSchemaResourceOpportunities.test.js
    - tests/currentSchemaEcologyRegistry.test.js
    - tests/currentSchemaCharacterRuntime.test.js
  benchmark_protocol_guard: tests/benchmarkProtocol.test.js
modules:
  - game-runtime
  - persistent-state
  - web-ui
  - deterministic-simulation
quality:
  deterministic_simulation: preserve
  save_compatibility: current-schema-only-pre-alpha
  current_game_state_must_be_complete_before_revival: true
  raw_current_schema_validation_before_runtime_normalization: true
  active_task_links_must_be_persisted_and_consistent: true
  required_domain_registries_validate_before_revival:
    - timed-tasks
    - active-travel
    - projects
    - commitments
    - relationships
    - resource-opportunities
    - ecology
    - party
    - ability-runtime
  future_migrations: deliberate-only-when-required
  canonical_action_results_only: true
  resource_lifecycle_review: required
  long_session_stability: deterministic-smoke-required-for-lifecycle-sensitive-work
  benchmark_protocol: 3
  benchmark_warmup_ratio: 0.1
  hard_performance_thresholds: not-yet-accepted
constraints:
  - use current repository authority rather than conversation memory
  - preserve the original-world canon and legacy/reference boundary
  - preserve the distinction between fictional simulation time and wall-clock scheduling
  - preserve player-facing acquired-knowledge map privacy
  - reject incompatible or incomplete pre-alpha saves/accounts rather than adding compatibility scaffolding by default
  - keep the generic migration substrate available for future deliberate migrations without making migration automatic
  - keep carried inventory/container facts under inventory authority rather than duplicating container knowledge in consumers
  - do not reintroduce retired FFXI command runtime compatibility
  - direct production timed-task creation requires an explicit domain owner, exactly-once reconciliation, and terminal release responsibility
  - do not add blind global timed-task pruning when no concrete generic producer/history requirement exists
  - raw Game State 6 validation must reject malformed required domain registries before runtime ensure helpers can normalize them
  - classify remaining state as persistent authority, derived/transient, or construction convenience before adding another raw validator
  - roadmap sequencing does not authorize unbounded implementation
