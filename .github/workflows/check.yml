name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Repository Audit
        run: npm run audit:repo
      - name: Test
        run: npm test
      - name: Content Census
        run: npm run census
      - name: Benchmark
        run: npm run benchmark
      - name: Benchmark Sample
        run: npm run benchmark:sample
